# SonarQube Project Configuration
# Sistema de Inventario - Infrastructure as Code

# Project identification
sonar.projectKey=sistema-inventario
sonar.projectName=Sistema de Inventario
sonar.projectVersion=1.0

# Source directories
sonar.sources=backend,frontend/src,terraform
sonar.tests=backend/tests,frontend/src/__tests__

# Exclusions
sonar.exclusions=**/node_modules/**,\
    **/dist/**,\
    **/build/**,\
    **/coverage/**,\
    **/*.test.js,\
    **/*.spec.js,\
    **/tests/**,\
    **/.terraform/**,\
    **/terraform.tfstate*

# Test exclusions
sonar.test.exclusions=**/*.test.js,**/*.spec.js

# Coverage
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info
sonar.coverage.exclusions=**/*.test.js,**/*.spec.js,**/tests/**

# Language-specific settings
sonar.sourceEncoding=UTF-8

# JavaScript/TypeScript settings
sonar.javascript.node.maxspace=4096

# Terraform plugin settings (if available)
# sonar.terraform.provider.aws.version=latest

# Quality Gate
# Minimum coverage threshold
# sonar.coverage.minimum=80

# Duplication threshold
# sonar.cpd.exclusions=**/terraform/**

# Issue exclusions (if needed)
# sonar.issue.ignore.multicriteria=e1
# sonar.issue.ignore.multicriteria.e1.ruleKey=javascript:S1192
# sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.js
